name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application versions
        run: pnpm verify:versions

      - name: Verify frontend-backend contracts
        run: pnpm verify:contracts

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Test frontend
        run: pnpm test

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Test Windows Credential Manager integration
        env:
          OPENQUOTA_TEST_CREDENTIAL_STORE: '1'
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml
          providers::credential_store::tests::system_credential_store_round_trip_when_requested
          -- --exact --nocapture

      - name: Build Windows installer
        run: pnpm build:installer

      - name: Smoke test packaged application
        uses: ./.github/actions/platform-smoke

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenQuota-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
