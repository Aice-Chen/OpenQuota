name: OpenQuota Windows smoke
description: Installs, launches, verifies tray readiness, and uninstalls the packaged Windows NSIS installer.

inputs:
  artifact-root:
    description: Tauri bundle directory containing the packaged Windows NSIS artifact.
    required: false
    default: src-tauri/target/release/bundle

runs:
  using: composite
  steps:
    - name: Install, start, and uninstall the Windows NSIS package
      shell: pwsh
      env:
        OPENQUOTA_SMOKE_ARTIFACT_ROOT: ${{ inputs.artifact-root }}
      run: >-
        & "$env:GITHUB_ACTION_PATH/scripts/windows.ps1"
        -InstallerDirectory "$env:OPENQUOTA_SMOKE_ARTIFACT_ROOT/nsis"
